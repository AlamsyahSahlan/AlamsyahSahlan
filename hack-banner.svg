<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04080d"/>
      <stop offset="50%" stop-color="#07161b"/>
      <stop offset="100%" stop-color="#040b11"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff88" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00ff88" stroke-width="0.4" stroke-opacity="0.12"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Courier New', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .rain { font-family: 'Courier New', Consolas, monospace; font-size: 12px; fill: #00ff88; opacity: 0.22; }
    .rain-bright { font-family: 'Courier New', Consolas, monospace; font-size: 12px; fill: #55ffaa; opacity: 0.38; }
    .hud { font-family: 'Courier New', Consolas, monospace; font-size: 11px; fill: #00ff88; opacity: 0.7; }
    .title { font-size: 42px; font-weight: 800; fill: #ffffff; letter-spacing: 1.5px; }
    .subtitle { font-size: 15px; font-weight: 500; fill: #7ee787; letter-spacing: 0.8px; }
    .blink { animation: blinker 1.2s infinite; }
    @keyframes blinker {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <!-- Background -->
  <rect width="900" height="220" rx="12" fill="url(#bg)"/>
  <rect width="900" height="220" rx="12" fill="url(#grid)"/>

  <!-- Animated Matrix / Binary Code Rain Columns in Background -->
  <g>
    <text x="35" y="-20" class="rain">01001101<tspan x="35" dy="16">10110010</tspan><tspan x="35" dy="16">0x7F8A1C</tspan><tspan x="35" dy="16">01101001</tspan><tspan x="35" dy="16">SYN_ACK</tspan><tspan x="35" dy="16">11010110</tspan>
      <animate attributeName="y" from="-100" to="240" dur="5.5s" repeatCount="indefinite"/>
    </text>
    <text x="120" y="-60" class="rain-bright">11001010<tspan x="120" dy="16">00110101</tspan><tspan x="120" dy="16">DECRYPT</tspan><tspan x="120" dy="16">10101111</tspan><tspan x="120" dy="16">0x00FF88</tspan>
      <animate attributeName="y" from="-80" to="240" dur="4.2s" repeatCount="indefinite"/>
    </text>
    <text x="210" y="-40" class="rain">01010101<tspan x="210" dy="16">SSH_22</tspan><tspan x="210" dy="16">11100011</tspan><tspan x="210" dy="16">00011100</tspan><tspan x="210" dy="16">ROOT_OK</tspan>
      <animate attributeName="y" from="-90" to="240" dur="6.8s" repeatCount="indefinite"/>
    </text>
    <text x="310" y="-90" class="rain">10011001<tspan x="310" dy="16">01100110</tspan><tspan x="310" dy="16">PACKET</tspan><tspan x="310" dy="16">11011011</tspan>
      <animate attributeName="y" from="-70" to="240" dur="5.0s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="-50" class="rain">01110010<tspan x="450" dy="16">0x4A9E</tspan><tspan x="450" dy="16">10001101</tspan><tspan x="450" dy="16">BYPASS</tspan>
      <animate attributeName="y" from="-90" to="240" dur="6.1s" repeatCount="indefinite"/>
    </text>
    <text x="580" y="-30" class="rain-bright">10101010<tspan x="580" dy="16">ACCESS</tspan><tspan x="580" dy="16">01010101</tspan><tspan x="580" dy="16">11110000</tspan>
      <animate attributeName="y" from="-85" to="240" dur="4.6s" repeatCount="indefinite"/>
    </text>
    <text x="690" y="-70" class="rain">00101101<tspan x="690" dy="16">11010010</tspan><tspan x="690" dy="16">CIPHER</tspan><tspan x="690" dy="16">01101100</tspan><tspan x="690" dy="16">0x99FD</tspan>
      <animate attributeName="y" from="-100" to="240" dur="5.9s" repeatCount="indefinite"/>
    </text>
    <text x="795" y="-40" class="rain-bright">11100101<tspan x="795" dy="16">00011010</tspan><tspan x="795" dy="16">ONLINE</tspan><tspan x="795" dy="16">10110101</tspan>
      <animate attributeName="y" from="-75" to="240" dur="4.9s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Animated Cyber Scan Line -->
  <rect x="0" y="-30" width="900" height="24" fill="url(#scanGrad)">
    <animate attributeName="y" values="-30;220;-30" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner Hacking HUD Logs -->
  <text x="20" y="26" class="hud">[SYS.INIT] &gt; Establishing encrypted tunnel...</text>
  <text x="20" y="42" class="hud">[AUTH.KEY] &gt; RSA-4096 handshake verified</text>
  <text x="650" y="26" class="hud">NODE: MKS-IDN // PORT: 443</text>
  <text x="650" y="42" class="hud">STATUS: <tspan fill="#00ff88" font-weight="bold">ACCESS GRANTED</tspan><tspan class="blink">_</tspan></text>

  <!-- Center Dark Glass Panel for Crisp Readability -->
  <rect x="140" y="55" width="620" height="110" rx="10" fill="#040a0f" fill-opacity="0.78" stroke="#00ff88" stroke-width="1" stroke-opacity="0.45"/>

  <!-- Main Name & Subtitle -->
  <text x="450" y="106" text-anchor="middle" class="sans title" filter="url(#glow)">Alamsyah Sahlan</text>
  <text x="450" y="138" text-anchor="middle" class="mono subtitle">&gt; Informatics Student • Universitas Muhammadiyah Makassar <tspan class="blink">█</tspan></text>

  <!-- Bottom Hacking Progress Bar -->
  <text x="20" y="202" class="hud">[PROCESS: SYSTEM_SCAN]</text>
  <rect x="175" y="192" width="550" height="10" rx="5" fill="#0d2128" stroke="#00ff88" stroke-width="0.6" stroke-opacity="0.5"/>
  <rect x="175" y="192" width="0" height="10" rx="5" fill="url(#barGrad)">
    <animate attributeName="width" values="40;550;550;40" keyTimes="0;0.75;0.9;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="740" y="202" class="hud" fill="#00d4ff">100% COMPLETE</text>

  <!-- Outer Neon Border -->
  <rect x="1" y="1" width="898" height="218" rx="12" fill="none" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.4"/>
</svg>